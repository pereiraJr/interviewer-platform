openapi: 3.1.0
info:
  title: AfterQuery Interviewer Platform - Jobs API
  version: 1.0.0
  description: >
    Read-only job catalogue API used by the candidate Jobs Dashboard. This slice exposes
    only the list endpoint; job detail and interview endpoints are future work.
servers:
  - url: http://localhost:4000
    description: Local development
paths:
  /api/jobs:
    get:
      operationId: listJobs
      summary: List all currently available jobs
      description: >
        Returns every job whose status is available, in a single response (no pagination).
        Results are ordered newest first.
      tags:
        - jobs
      responses:
        "200":
          description: The available job catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobSummary"
              examples:
                populated:
                  value:
                    jobs:
                      - id: "652f1a9b8c1d2e3f4a5b6c7d"
                        title: "Senior Backend Engineer"
                        description: "Design and scale our interview APIs."
                      - id: "652f1a9b8c1d2e3f4a5b6c7e"
                        title: "Product Designer"
                        description: "Own end-to-end candidate experience."
                empty:
                  value:
                    jobs: []
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    JobSummary:
      type: object
      additionalProperties: false
      required: [id, title, description]
      properties:
        id:
          type: string
          description: Stable, unique job identifier.
          minLength: 1
        title:
          type: string
          description: Job title shown on the card.
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: >
            Brief description shown on the card. Always a string; may be empty when no
            description is available.
          maxLength: 500
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
              examples: ["INTERNAL_ERROR"]
            message:
              type: string
              description: Human-readable, non-sensitive error message.
